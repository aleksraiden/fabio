default:
  image: alpine:3.22
  before_script:
    - echo "http://alpine.biqutex.dev/alpine/v3.22/main" > /etc/apk/repositories
    - apk update && apk upgrade
    - cd $CI_PROJECT_DIR
       
stages:
  - build

Build Docker/base image:
  stage: build
  image: docker:latest 
  needs: []
  before_script:
    - echo -n $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "http://alpine.biqutex.dev/alpine/v3.22/main" >| /etc/apk/repositories
    - apk update && apk upgrade && apk add ca-certificates tzdata coreutils
    
  except:
    - tags
    
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:biqutex-fabio-latest 
#    IMAGE_TAG2: $CI_REGISTRY_IMAGE:biqutex-fabio-$CI_COMMIT_SHORT_SHA

  script:
    - docker build --tag $IMAGE_TAG --pull --platform linux/amd64 --label 'version=$CI_COMMIT_BRANCH' --label 'project=$CI_PROJECT_NAME' --label 'company=$COMPANY_NAME' --label 'author=$CI_COMMIT_AUTHOR' --label 'commit-sha=$CI_COMMIT_SHA' --file=Dockerfile.biqutex --network host . 
    - timeout --preserve-status 15s docker run --rm $IMAGE_TAG 
    - docker push $IMAGE_TAG
    - echo $IMAGE_TAG


Build Docker/release image:
  stage: build
  image: docker:latest 
  needs: []
  only:
    - tags
  before_script:
    - echo -n $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "http://alpine.biqutex.dev/alpine/v3.22/main" >| /etc/apk/repositories
    - apk update && apk upgrade && apk add git ca-certificates tzdata
    - export CI_PROJECT_NAME_LOWERCASE=$(echo "$CI_PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:biqutex-release-$CI_COMMIT_TAG
  script:
    - docker build --tag $IMAGE_TAG --pull --platform linux/amd64 --label 'version=$CI_COMMIT_BRANCH' --label 'project=$CI_PROJECT_NAME' --label 'company=$COMPANY_NAME' --label 'author=$CI_COMMIT_AUTHOR' --label 'commit-sha=$CI_COMMIT_SHA' --file=Dockerfile.biqutex --network host . 
    - docker push $IMAGE_TAG
    - echo $IMAGE_TAG
    - echo "Pushed to prod registry"
#    - echo -n $PROD_REGISTRY_AUTH_PASSWORD | docker login -u $PROD_REGISTRY_AUTH_USER --password-stdin $PROD_REGISTRY_HOST
#    - docker tag $IMAGE_TAG $PROD_REGISTRY_HOST/$CI_PROJECT_NAME_LOWERCASE:biqutex-release-$CI_COMMIT_TAG
